<!doctype html>
<html lang="si">
<head>
<meta charset="utf-8">
<title>Handa Mama logo</title>
<style>
  @font-face { font-family: "Gemunu Libre"; font-weight: 800; src: url(../fonts/gemunu-libre-sinhala-800-normal.woff2) format("woff2"); }
  @font-face { font-family: "Gemunu Libre"; font-weight: 500; src: url(../fonts/gemunu-libre-sinhala-500-normal.woff2) format("woff2"); }
  @font-face { font-family: "Gemunu Libre"; font-weight: 500; src: url(../fonts/gemunu-libre-latin-500-normal.woff2) format("woff2"); unicode-range: U+0000-00FF; }
  html, body { margin: 0; background: transparent; }
  .lockup { display: inline-flex; align-items: center; gap: 28px; padding: 32px 48px 32px 32px; border-radius: 40px; }
  .lockup.dark { background: #141B3A; }
  .lockup.light { background: #FBF4E4; }
  .lockup img { width: 200px; height: 200px; }
  .name { font-family: "Gemunu Libre"; font-weight: 800; font-size: 104px; line-height: .95; }
  .sub { font-family: "Gemunu Libre"; font-weight: 500; font-size: 52px; line-height: 1.1; letter-spacing: .02em; }
  .en { font-family: "Gemunu Libre"; font-weight: 500; font-size: 24px; letter-spacing: .32em; text-transform: uppercase; margin-top: 10px; opacity: .7; }
  .dark .name { color: #FFE29A; } .dark .sub { color: #FBF4E4; } .dark .en { color: #C9D2F2; }
  .light .name { color: #22306A; } .light .sub { color: #B9472F; } .light .en { color: #22306A; }
</style>
</head>
<body>
  <div class="lockup dark" id="dark">
    <img src="../icons/logo-mark.svg" alt="">
    <div><div class="name">හඳ මාමා</div><div class="sub">කතන්දර</div><div class="en">Handa Mama Stories</div></div>
  </div>
  <br>
  <div class="lockup light" id="light">
    <img src="../icons/logo-mark.svg" alt="">
    <div><div class="name">හඳ මාමා</div><div class="sub">කතන්දර</div><div class="en">Handa Mama Stories</div></div>
  </div>
</body>
</html>
