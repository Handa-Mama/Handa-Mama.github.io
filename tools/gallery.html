<!doctype html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scene gallery</title>
<link rel="stylesheet" href="../css/app.css">
<style>
  body { background: #222; padding: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  figure { margin: 0; background: #333; border-radius: 10px; overflow: hidden; }
  figure .box { aspect-ratio: 4 / 3; position: relative; }
  figure svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  figcaption { font: 14px monospace; padding: 6px 10px; color: #ddd; }
</style>
</head>
<body>
<div class="grid" id="g"></div>
<script src="../js/art.js"></script>
<script src="../js/scenes.js"></script>
<script>
  document.body.insertAdjacentHTML('afterbegin', HM_ART.DEFS);
  const g = document.getElementById('g');
  const names = HM_SCENES.names.filter((n) => n !== 'goodnight');
  const ids = ['pipasitha-kaputa', 'nariya-saha-midi', 'sinha-saha-meeya', 'ibba-saha-haawa', 'andare-saha-rajathuma', 'mee-puncha'];
  const items = names.map((n) => [n, n, undefined]).concat(ids.map((id) => ['goodnight:' + id, 'goodnight', id]));
  for (const [label, n, arg] of items) {
    g.insertAdjacentHTML('beforeend', `<figure><div class="box">${HM_SCENES.render(n, arg)}</div><figcaption>${label}</figcaption></figure>`);
  }
  g.addEventListener('click', (e) => {
    const t = e.target.closest('[data-tap]');
    if (t && HM_SCENES.taps[t.dataset.tap]) HM_SCENES.taps[t.dataset.tap](t, t.closest('svg'));
  });
</script>
</body>
</html>
