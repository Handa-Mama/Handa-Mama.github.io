name: record narration
# Records the "read to me" audio (tools/narrate.py) and commits it to the branch it ran on.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['data/stories.js', 'tools/narrate.py', '.github/workflows/narrate.yml']
permissions:
  contents: write
concurrency:
  group: narrate-${{ github.ref }}
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install edge-tts==7.3.1
      - run: python tools/narrate.py
      - name: commit the clips
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio data/narration.js
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Record narration for read to me"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
